name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordenar los archivos en sus carpetas
        run: |
          mkdir -p www ci/native assets
          mv index.html www/index.html
          mv prepare.sh patch_android.py empty.js debug.keystore ci/
          mv MainActivity.java VisorPlugin.java ci/native/
          mv icon-only.png icon-foreground.png icon-background.png assets/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar librerías (JSZip y unrar) dentro de la app
        run: bash ci/prepare.sh

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Icono de la app (si falla, se usa el icono por defecto)
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1a1a1a' || echo "Sin icono personalizado"

      - name: Agregar el código propio (carpetas, abrir con, volumen)
        run: python3 ci/patch_android.py

      - name: Firma estable (para poder actualizar la app sin desinstalarla)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: visor-cbr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
